[project]
name = "money"
version = "0.1.0"
description = "Multi-factor stock selection, backtesting and portfolio risk engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
money = "money.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["money*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
